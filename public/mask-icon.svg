<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g fill="white" transform="translate(15, 20)">
    <!-- Network nodes -->
    <circle cx="35" cy="15" r="8"/>
    <circle cx="10" cy="40" r="6"/>
    <circle cx="60" cy="35" r="7"/>
    <circle cx="25" cy="55" r="6"/>
    <circle cx="55" cy="55" r="6"/>
    <!-- Connection lines -->
    <line x1="35" y1="15" x2="10" y2="40" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="35" y1="15" x2="60" y2="35" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="10" y1="40" x2="25" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="60" y1="35" x2="55" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
    <line x1="25" y1="55" x2="55" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
